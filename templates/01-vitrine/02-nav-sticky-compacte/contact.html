<html lang="fr" class="is-authoring">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Formulaire en colonne étroite.">

  <link rel="stylesheet" href="../../../_core/reset.css">
  <link rel="stylesheet" href="../../../_core/tokens.css">
  <link rel="stylesheet" href="../../../_core/palettes/blanc-graphite.css" data-palette-link>
  <link rel="stylesheet" href="../../../_core/directions/presque-rien.css" data-direction-link>
  <link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>

<a class="skip" href="#contenu">Aller au contenu</a>

<nav class="pastille" aria-label="Principale">
  <details class="pastille__menu">
    <summary>
      <span class="pastille__rang">—</span>
      <span class="pastille__total">contact</span>
      <span class="visually-hidden">Ouvrir le sommaire</span>
    </summary>
    <ul class="pastille__liste">
      <li><a href="index.html">Retour</a></li>
      <li><a href="page.html">Page</a></li>
    </ul>
  </details>
</nav>

<main id="contenu" class="colonne">

  <header class="ouverture">
    <h1>Écrire</h1>
    <p class="cote">Lorem ipsum — contact</p>
  </header>

  <form class="formulaire" action="#" method="post" novalidate>
    <p class="champ">
      <label for="nom">Nom *</label>
      <input id="nom" name="nom" type="text" required autocomplete="name">
    </p>
    <p class="champ">
      <label for="courriel">Courriel *</label>
      <input id="courriel" name="courriel" type="email" required autocomplete="email"
             aria-describedby="aide-courriel">
      <span class="aide" id="aide-courriel">Format attendu : nom@domaine.test</span>
    </p>
    <p class="champ">
      <label for="message">Message *</label>
      <textarea id="message" name="message" rows="7" required></textarea>
    </p>
    <p class="champ champ--inline">
      <input id="copie" name="copie" type="checkbox">
      <label for="copie">Recevoir une copie</label>
    </p>
    <p><button type="submit">Envoyer</button></p>
    <p class="aide" role="status">Aucun envoi effectué.</p>
  </form>

  <section class="bloc">
    <p class="bloc__num" aria-hidden="true">—</p>
    <h2>Coordonnées</h2>
    <p>00 rue Lorem, 00000 Ipsum<br>00 00 00 00 00<br>lorem@ipsum.test</p>
  </section>

</main>

<footer class="pied">
  <p>Lorem ipsum · <a href="#" data-stub>Mentions légales</a> · <a href="#" data-stub>Archives</a></p>
</footer>

</body>
</html>

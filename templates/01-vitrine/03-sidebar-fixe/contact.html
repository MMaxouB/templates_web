    <header class="entree">
      <h1>Écrire</h1>
      <p class="entree__ligne">Contact — 003</p>
    </header>

    <form class="formulaire" action="#" method="post" novalidate>
      <p class="champ">
        <label for="nom">Nom *</label>
        <input id="nom" name="nom" type="text" required autocomplete="name">
      </p>
      <p class="champ">
        <label for="courriel">Courriel *</label>
        <input id="courriel" name="courriel" type="email" required autocomplete="email"
               aria-describedby="aide-courriel">
        <span class="aide" id="aide-courriel">Format attendu : nom@domaine.test</span>
      </p>
      <p class="champ">
        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="6" required></textarea>
      </p>
      <p class="champ champ--inline">
        <input id="copie" name="copie" type="checkbox">
        <label for="copie">Recevoir une copie</label>
      </p>
      <p><button type="submit">Envoyer</button></p>
      <p class="aide" role="status">Aucun envoi effectué.</p>
    </form>

    <section class="section">
      <p class="section__num">—</p>
      <h2>Coordonnées</h2>
      <dl class="donnees">
        <div><dt>Adresse</dt><dd>00 rue Lorem, 00000 Ipsum</dd></div>
        <div><dt>Ligne</dt><dd>00 00 00 00 00</dd></div>
        <div><dt>Courriel</dt><dd>lorem@ipsum.test</dd></div>

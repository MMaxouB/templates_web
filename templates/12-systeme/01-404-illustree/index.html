<!doctype html>

<main class="stage">

      <!-- Lignes de texte -->
      <g class="art__lines">
        <rect x="66" y="42" width="68" height="5" rx="2.5"/>
        <rect x="66" y="56" width="52" height="5" rx="2.5"/>
        <rect x="66" y="70" width="60" height="5" rx="2.5"/>
        <rect x="66" y="84" width="34" height="5" rx="2.5"/>
      </g>

      <!-- Loupe -->
      <circle cx="164" cy="94" r="34" class="art__glass"/>
      <circle cx="164" cy="94" r="34" class="art__ring"/>
      <line x1="188" y1="118" x2="212" y2="142" class="art__handle"/>

      <!-- Point d'interrogation dans la loupe -->
      <text x="164" y="106" text-anchor="middle" class="art__mark">?</text>
    </svg>
  </figure>

  <div class="stage__text">
    <p class="eyebrow">Erreur 404</p>

      <label class="visually-hidden" for="q">Rechercher</label>
      <input type="search" id="q" name="q" placeholder="Lorem ipsum dolor…" autocomplete="off">
      <button type="submit" class="btn">Rechercher</button>
    </form>

    <nav class="links" aria-label="Liens de secours">
      <a class="links__item" href="#" data-stub>Lorem ipsum</a>
      <a class="links__item" href="#" data-stub>Dolor sit amet</a>
      <a class="links__item" href="#" data-stub>Consectetur elit</a>

    </nav>

    <p class="back">
